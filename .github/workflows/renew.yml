name: XServer Extend (Node.js Matrix)

on:
  schedule:
    # 原为 '0 */2 * * *'（UTC 每2小时整点）。
    # 建议加密：自等待模式下脚本秒退成本极低，加密能显著缩短"预约-退出"兜底路径的拾起间隔。
    #   - 公共仓库（Actions 免费不限分钟）: 用 */30 * * * *（每30分钟）
    #   - 私有仓库免费账号（2000分钟/月配额有限）: 用 15 * * * *（每小时）即可
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 防止 schedule 与手动触发、或延迟积压的多轮触发并发跑同一个 renew job，
# 避免多个实例同时读写 status.json / 同时续期。
concurrency:
  group: xserver-renew
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate account list
        id: set-matrix
        shell: bash
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          ACCOUNTS=$(echo "$ALL_SECRETS" | jq -r 'keys[] | select(startswith("EML_"))' | sed 's/EML_//' | shuf)
          if [ -z "$ACCOUNTS" ]; then
            HAS_SINGLE=$(echo "$ALL_SECRETS" | jq -r 'keys[] | select(. == "EML")')
            if [ -n "$HAS_SINGLE" ]; then
              echo "matrix=[\"SINGLE\"]" >> $GITHUB_OUTPUT
            else
              echo "Error: No EML_1 or EML secrets found."
              exit 1
            fi
          else
            INDEX_ARRAY=$(echo "$ACCOUNTS" | jq -R . | jq -s -c .)
            echo "matrix=$INDEX_ARRAY" >> $GITHUB_OUTPUT
          fi

  renew:
    needs: setup
    runs-on: ubuntu-latest
    # 自等待模式会让单 job 运行数小时，必须显式设置超时上限。
    # 公共仓库最大 360（6小时）；私有仓库可设更大（如 720）。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_index: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y jq fonts-noto-cjk python3 wget

      - name: Start Proxy Tunnel
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "ℹ️ 未配置 PROXY_URL，跳过代理"
            exit 0
          fi

          SINGBOX_VER="1.11.0"
          echo "📦 下载 sing-box v${SINGBOX_VER}..."
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

          echo "🔗 解析代理协议..."
          python3 proxy_handler.py

          if [ ! -f config.json ]; then
            echo "❌ 代理配置生成失败"
            exit 1
          fi

          echo "✅ 代理配置已生成:"
          cat config.json

          nohup ./sing-box run -c config.json > singbox.log 2>&1 &

          echo "⏳ 等待代理就绪..."
          for i in $(seq 1 15); do
            if curl -s -x http://127.0.0.1:8080 --max-time 3 https://api.ipify.org > /dev/null 2>&1; then
              echo "✅ 代理已就绪 (${i}s)"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "❌ 代理启动超时，sing-box 日志:"
              cat singbox.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Extension Script
        env:
          ACC: ${{ matrix.account_index == 'SINGLE' && secrets.EML || secrets[format('EML_{0}', matrix.account_index)] }}
          ACC_PWD: ${{ matrix.account_index == 'SINGLE' && secrets.PWD || secrets[format('PWD_{0}', matrix.account_index)] }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ID: ${{ secrets.TG_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node renew.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.account_index }}
          path: "*.png"
          retention-days: 5

      - name: Persist status.json
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || echo "No remote changes"
          if [ -f status.json ]; then
            git add status.json
            git commit -m "chore: Update status.json for ${{ matrix.account_index }} [skip ci]" || echo "No changes"
            git push
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --workflow="${{ github.workflow }}" --limit=1000 --json databaseId --jq '.[].databaseId')
          COUNT=0
          for RUN_ID in $RUNS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 1 ]; then
              echo "删除运行记录: $RUN_ID"
              gh run delete "$RUN_ID"
              sleep 0.5
            fi
          done
          echo "共处理 ${COUNT} 条记录，保留最新 1 条"
